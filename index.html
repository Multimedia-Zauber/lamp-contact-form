<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamp Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="scene">
    <div class="ambient ambient-1"></div>
    <div class="ambient ambient-2"></div>
    <div class="ambient ambient-3"></div>

    <section class="lamp-area">
        <div class="light-cone"></div>
        <div class="lamp">
            <div class="lamp-shade">
                <div class="lamp-glow"></div>
            </div>
            <div class="lamp-pole"></div>
            <div class="lamp-base"></div>

            <button class="pull-switch" id="pullSwitch" aria-label="Lampe ein- oder ausschalten">
                <span class="cord"></span>
                <span class="cord-handle"></span>
            </button>
        </div>
    </section>

    <section class="contact-card">
        <div class="contact-header">
            <span class="small-title">GET IN TOUCH</span>
            <h1>Kontakt</h1>
            <p>Hast du eine Idee oder ein Projekt? Schreib mir eine Nachricht.</p>
        </div>

        <form>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Dein Name" required>
            </div>

            <div class="form-group">
                <label for="email">E-Mail</label>
                <input type="email" id="email" placeholder="name@beispiel.ch" required>
            </div>

            <div class="form-group">
                <label for="message">Nachricht</label>
                <textarea id="message" rows="4" placeholder="Erzähl mir von deinem Projekt..." required></textarea>
            </div>

            <button type="submit" class="send-button">
                Nachricht senden
                <span>→</span>
            </button>
        </form>
    </section>

    <div class="hint">
        <span>↓</span>
        Zieh an der Schnur
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
